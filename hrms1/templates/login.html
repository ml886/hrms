<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - {{ sys_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body{margin:0;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#1f2937 0%,#2c5aa0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-card{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:380px;overflow:hidden}
  .login-head{background:#1f2937;color:#fff;padding:28px 32px;text-align:center}
  .login-head i{font-size:40px;color:#60a5fa}
  .login-logo{display:block;margin:0 auto 6px;width:48px;height:48px;object-fit:contain;border-radius:10px;background:#fff;padding:4px}
  .login-head h2{font-size:20px;margin:10px 0 4px;font-weight:700}
  .login-head p{margin:0;color:#9ca3af;font-size:13px}
  .login-body{padding:28px 32px}
  .form-control{padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
  .form-control:focus{border-color:#2c5aa0;box-shadow:0 0 0 3px rgba(44,90,160,.12)}
  .btn-login{background:#2c5aa0;color:#fff;border:none;padding:11px;width:100%;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-login:hover{background:#1f4373}
  .alert{font-size:13px}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-head">
      {% if logo_url %}<img src="{{ logo_url }}" class="login-logo" alt="logo">{% else %}<i class="bi bi-people-fill"></i>{% endif %}
      <h2>{{ sys_title }}</h2>
      <p>HRMS · v{{ app_version }}</p>
  </div>
  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}
        <div class="alert alert-danger">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="请输入用户名">
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required placeholder="请输入密码">
      </div>
      <button type="submit" class="btn-login">登 录</button>
    </form>
  </div>
</div>
</body>
</html>
